[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clickstream-anomaly-detection"
version = "1.0.0"
description = "Real-time clickstream ingestion, stream processing, and anomaly detection pipeline using Apache Kafka, PySpark Structured Streaming, and S3."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Mohammad Javad Dianat", email = "dianatofficial9@gmail.com"}
]
keywords = [
    "data-engineering",
    "apache-kafka",
    "pyspark",
    "structured-streaming",
    "stream-processing",
    "clickstream",
    "anomaly-detection",
    "minio",
    "s3",
    "distributed-systems"
]
dependencies = [
    "pyspark>=3.5.0",
    "kafka-python>=2.0.2",
    "minio>=7.2.0",
    "faker>=25.0.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.7.0",
    "streamlit>=1.36.0",
    "pandas>=2.2.0",
    "plotly>=5.22.0",
    "pyarrow>=16.0.0",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "flake8>=7.0.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "mypy>=1.10.0"
]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests"
]
pythonpath = [
    "."
]
